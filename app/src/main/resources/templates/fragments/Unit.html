<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:fragment="unitFragment(unitPrintCard, showHackingProgram)">
    <div class="card" th:data-info="'combinedId:' + ${unitPrintCard.getCombinedProfileId()}">
        <div class="card-content" >

            <img th:if="${printOptions.isShowSectorialIcon() && printOptions.getTemplate().isSupportImages()}"
                 th:src="${unitPrintCard.getSectorialImageName()}"
                 class="sectorial-background"
                 alt=""/>
            <th:block
                    th:replace="~{fragments/UnitHeader :: unitHeaderFragment(${unitPrintCard})}">
            </th:block>
            <div th:class="${unitPrintCard.isShowImage()} ? 'unit-image-area' : 'non-unit-image-area'">

                <img th:if="${unitPrintCard.isShowImage()}"
                     th:src="${unitPrintCard.getUnitImageName()}"
                     class="unit-img"
                     alt=""/>

                <div th:class="${unitPrintCard.isShowImage()} ? 'area-for-image' : 'no-image'">
                    <div class="attribut-equipment-skill-column">
                        <th:block
                                th:replace="~{fragments/AttributsTable :: attributsFragment(${unitPrintCard})}">
                        </th:block>

                        <th:block
                                th:replace="~{fragments/EquipmentsAndSkills :: equipmentsAndSkills(${unitPrintCard})}">
                        </th:block>
                    </div>
                </div>
            </div>
            <th:block
                    th:replace="~{fragments/WeaponTable :: weaponTableFragment(${unitPrintCard.getWeapons()}, ${unitPrintCard.getProfile()}, ${unitPrintCard.getMartialArtLevel()})}">
            </th:block>
            <div th:if="${showHackingProgram}">
                <th:block
                        th:replace="~{fragments/HackingTable :: hackingProgramsTableFragment(${unitPrintCard.getHackingPrograms()}, false, true)}">
                </th:block>
            </div>
        </div>
    </div>
</div>

</body>
</html>
