<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:fragment="bootyWeaponFragment()">
    <div class="card" th:if="${bootyWeapons != null and not #lists.isEmpty(bootyWeapons)}">
        <div class="card-content">
            <div class="card-header">
                <h2 class="card-header-title">Booty Weapons</h2>
            </div>
            <th:block
                    th:replace="~{fragments/WeaponTable :: weaponTableFragment(${bootyWeapons}, null, null)}">
            </th:block>
        </div>
    </div>
</div>

</body>
</html>
