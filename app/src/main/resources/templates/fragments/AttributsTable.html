<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>

<div class="flex" th:fragment="attributsFragment(unitPrintCard)">
    <div class="typ-and-category">
        <div th:text="${unitPrintCard.getProfile().getType()}"></div>
        <div th:text="${unitPrintCard.getShortCategory()}"></div>
    </div>
    <table class="attribut">
        <thead>
        <tr>
            <th th:utext="#{attributs.table.header.MOV}">MOV</th>
            <th th:utext="#{attributs.table.header.CC}">CC</th>
            <th th:utext="#{attributs.table.header.BS}">BS</th>
            <th th:utext="#{attributs.table.header.PH}">PH</th>
            <th th:utext="#{attributs.table.header.WIP}">WIP</th>
            <th th:utext="#{attributs.table.header.ARM}">ARM</th>
            <th th:utext="#{attributs.table.header.BTS}">BTS</th>
            <th th:text="${unitPrintCard.getProfile().isStructure()} ? #{attributs.table.header.STR} : #{attributs.table.header.VITA}">
                Wounds
            </th>
            <th th:utext="#{attributs.table.header.S}">S</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td th:text="${unitPrintCard.getMove()}">0-0</td>
            <td th:text="${unitPrintCard.getCc()}">0</td>
            <td th:text="${unitPrintCard.getBs()}">0</td>
            <td th:text="${unitPrintCard.getPh()}">0</td>
            <td th:text="${unitPrintCard.getWip()}">0</td>
            <td th:text="${unitPrintCard.getArm()}">0</td>
            <td th:text="${unitPrintCard.getBts()}">0</td>
            <td th:text="${unitPrintCard.getProfile().getWounds()}">0</td>
            <td th:text="${unitPrintCard.getProfile().getSilhouette()}">0</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
