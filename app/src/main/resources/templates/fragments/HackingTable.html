<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>

<div th:fragment="hackingProgramsTableFragment(programs, showDeviceColumn, shortTableHeader)">
    <div th:if="${programs != null and not #lists.isEmpty(programs)}">
        <table class="hacking">
            <thead>
            <tr>
                <th th:utext="#{hacking.table.header.program.name}">Name</th>
                <th th:if="${showDeviceColumn}" th:utext="#{hacking.table.header.program.device}">Device</th>
                <th th:text="${shortTableHeader} ? #{hacking.table.header.program.modShort} : #{hacking.table.header.program.modLong}">A/O Mod</th>
                <th th:utext="#{weapon.table.header.weapon.burst}">B</th>
                <th th:utext="#{weapon.table.header.weapon.ps}">PS</th>
                <th th:utext="#{hacking.table.header.program.skill.type}">Skill Type</th>
                <th th:utext="#{hacking.table.header.program.description}">Description</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="program : ${programs}">
                <td th:text="${program.getName()}"></td>
                <td th:if="${showDeviceColumn}" th:text="${program.getDeviceNames()}"></td>
                <td th:text="${program.getModifier()}"></td>
                <td th:text="${program.getBurst()}"></td>
                <td th:text="${program.getPs()}"></td>
                <td th:text="${program.getSkillType()}"></td>
                <td class="hacking-program-description" th:text="${program.getDescription()}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
