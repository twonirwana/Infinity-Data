<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>

<div th:fragment="bootyRollFragment()">
    <div class="card" th:if="${bootyRolls != null and not #lists.isEmpty(bootyRolls)}">
        <div class="card-content">

            <div class="card-header">
                <h2 class="card-header-title" th:text="#{booty.title}">Booty</h2>
            </div>
            <table class="booty">
                <thead>
                <tr>
                    <th th:text="#{table.roll}">Roll</th>
                    <th th:text="#{table.bonus}">Bonus</th>
                    <th th:text="#{table.roll}">Roll</th>
                    <th th:text="#{table.bonus}">Bonus</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booty : ${bootyRolls}">
                    <td th:text="${booty.getRoll1()}"></td>
                    <td th:text="${booty.getBonus1()}"></td>
                    <td th:text="${booty.getRoll2()}"></td>
                    <td th:text="${booty.getBonus2()}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
