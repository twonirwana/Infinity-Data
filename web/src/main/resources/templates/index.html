<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{app.title}">Trooper Card Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" th:href="@{favicon.ico}">
    <style>
        :root {
            --primary-color-glow: #00d4ff;
            --primary-color-dark: #00a1c7;
            --dark-bg: #12151a;
            --content-bg: rgba(20, 25, 30, 0.85);
            --text-color: #e0e0e0;
            --text-muted: #8899aa;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Orbitron', sans-serif;
        }

        body {
            font-family: var(--font-body), sans-serif;
            background-color: var(--dark-bg);
            background-image: radial-gradient(ellipse at center, rgba(40, 50, 60, 0.8) 0%, var(--dark-bg) 70%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2em;
            box-sizing: border-box;
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border: 1px solid var(--primary-color-dark);
            border-radius: 4px;
        }

        .lang-switch a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .lang-switch a:hover,
        .lang-switch a.active {
            color: var(--primary-color-glow);
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
        }

        .lang-separator {
            color: var(--primary-color-dark);
        }

        h1 {
            font-family: var(--font-display), sans-serif;
            color: var(--primary-color-glow);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2rem;
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.7), 0 0 12px rgba(0, 212, 255, 0.5);
            margin-bottom: 1.5em;
            position: relative;
        }

        .form-container {
            max-width: 500px;
            width: 100%;
            background: var(--content-bg);
            padding: 2.5em;
            border: 2px solid var(--primary-color-glow);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5), 0 0 5px rgba(0, 212, 255, 0.8) inset;
            backdrop-filter: blur(5px);
            margin-bottom: 2em;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 0.5em;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: var(--primary-color-dark);
            letter-spacing: 1px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5em;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--primary-color-dark);
            color: var(--text-color);
            font-family: var(--font-body), sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease-in-out;
            box-sizing: border-box;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="text"]::placeholder {
            color: #667;
            opacity: 1;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color-glow);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .select-wrapper {
            position: relative;
            display: block;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 1rem;
            color: var(--primary-color-glow);
            position: absolute;
            right: 15px;
            top: 15px;
            pointer-events: none;
        }

        select {
            padding-right: 40px;
        }

        details {
            width: 100%;
            margin-bottom: 1.5em;
        }

        summary {
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: var(--primary-color-glow);
            letter-spacing: 1px;
            padding: 10px 0;
            border-bottom: 1px solid var(--primary-color-dark);
            transition: all 0.3s ease;
            outline: none;
        }

        summary:hover {
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.7);
        }

        .details-content {
            padding-top: 1.5em;
        }

        button {
            font-family: var(--font-display), sans-serif;
            padding: 12px 15px;
            cursor: pointer;
            border: 2px solid var(--primary-color-glow);
            background-color: transparent;
            color: var(--primary-color-glow);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 1rem;
            transition: all 0.3s ease-in-out;
            margin-top: 1em;
        }

        button:hover {
            background-color: var(--primary-color-glow);
            color: var(--dark-bg);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }

        .checkbox-group {
            margin-top: 0;
            margin-bottom: 0.5em;
            display: flex;
            flex-direction: column;
            gap: 1em;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 1rem;
            color: var(--text-color);
            text-transform: none;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 0;
        }

        .checkbox-label input[type="checkbox"] {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .checkbox-custom {
            position: relative;
            display: inline-block;
            width: 18px;
            height: 18px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--primary-color-dark);
            margin-right: 12px;
            transition: all 0.3s ease-in-out;
            flex-shrink: 0;
        }

        .checkbox-custom::after {
            content: "";
            position: absolute;
            display: none;
            left: 5px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid var(--primary-color-glow);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checkbox-label input[type="checkbox"]:checked + .checkbox-custom::after {
            display: block;
        }

        .checkbox-label input[type="checkbox"]:checked + .checkbox-custom {
            border-color: var(--primary-color-glow);
        }

        .checkbox-label input[type="checkbox"]:focus-visible + .checkbox-custom {
            outline: none;
            border-color: var(--primary-color-glow);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
            margin: 0 10px;
        }

        footer a:hover {
            color: var(--primary-color-glow);
            text-decoration: underline;
        }

        .footer-separator {
            color: var(--primary-color-dark);
        }

        .help, .allCsv, .avaChecker {
            margin-top: 10px;
            text-align: center;
        }

        .help a, .allCsv a, .avaChecker a {
            color: var(--primary-color-glow);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="lang-switch">
    <a th:href="@{''(lang='en')}" th:classappend="${#locale.language == 'en'} ? 'active' : ''">EN</a>
    <span class="lang-separator">|</span>
    <a th:href="@{''(lang='es')}" th:classappend="${#locale.language == 'es'} ? 'active' : ''">ES</a>
</div>

<div class="form-container">
    <h1 th:text="#{app.title}">Trooper Card Generator</h1>
    <form action="#" th:action="@{/generate}" method="get" target="_blank">

        <input type="hidden" name="lang" th:value="${#locale.language}" />
        <label for="armyData" th:text="#{form.army.label}">Army Code or Option IDs:</label>
        <input type="text" id="armyData" name="armyData" required
               th:placeholder="#{form.army.placeholder}">

        <label for="style-selector" th:text="#{form.style.label}">Select Card Style:</label>
        <div class="select-wrapper">
            <select id="style-selector" name="style">
                <option value="a4_image" selected th:text="#{style.a4_image}">Color and image - one per Page</option>
                <option value="c6onA4_image" th:text="#{style.c6onA4_image}">Color and image - 6 on one page</option>
                <option value="a4_overview" th:text="#{style.a4_overview}">Overview List</option>
                <option value="card_bw" th:text="#{style.card_bw}">Black and white - playing card (legacy and no options)</option>
            </select>
        </div>

        <details>
            <summary th:text="#{adv.summary}">Advanced Options</summary>

            <div class="details-content">
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="useCm" value="true" th:checked="${#locale.language == 'es'}">                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.useCm}">Use cm instead of inch</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="useLetterInsteadA4" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.useLetter}">Use Letter format instead of A4</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showSectorialIcon" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showSectorial}">Show Sectorial Icon in the background</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showUnitIcon" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showUnitIcon}">Show Unit Icon</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showUnitImages" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showUnitImages}">Show Unit Images</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="reduceColor" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.reduceColor}">Reduced color (better for black and white printers)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="distinctUnits" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.distinctUnits}">Remove duplicate units (removes also combat group number)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showAlwaysOptionFeatureInName" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showAlwaysOption}">Always append unique skills/weapons...</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showOptionFeatureInNameToDifferentiate" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showOptionFeature}">If there are multiple options, append...</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showCombatGroupNumber" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showCombatGroup}">Show Combat Group number</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showEquipmentWeapons" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showEquipment}">Show Equipment Weapons</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showSkillWeapon" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showSkillWeapon}">Show Skill Weapon</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showHackingPrograms" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showHacking}">Show Card with Hacking Programs</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showWeaponSkill" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showWeaponSkillCol}">Show Weapon Skill column</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showBurst" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showBurst}">Show Burst column</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showSavingRoll" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showSavingRoll}">Show Saving Roll column</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showAmmo" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showAmmo}">Show Ammo column</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showPs" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showPs}">Show PS column</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showSaveAttribute" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showSaveAttribute}">Show Saving Attribute column</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showNumberOfSaveRolls" value="true">
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showNumberSaveRolls}">Show Number Saving Rolls column</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="showWeaponTraits" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.showWeaponTraits}">Show Weapon Traits column</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="applyingSkillWeaponExtra" value="true" checked>
                        <span class="checkbox-custom"></span>
                        <span th:text="#{adv.applyingSkillWeapon}">Apply Weapon Skill Modifier...</span>
                    </label>

                </div>
            </div>
        </details>

        <button type="submit" th:text="#{btn.generate}">Generate and View Cards</button>
    </form>

    <div class="allCsv">
        <a th:href="@{/downloadAllUnits(lang=${#locale.language})}" target="_blank" th:text="#{link.downloadAll}">Download all Units as CSV</a>
        <a th:href="@{/csv(lang=${#locale.language})}" target="_blank" th:text="#{link.oldChanges}">(old/changes)</a>
    </div>

    <div class="avaChecker">
        <a th:href="@{/joinedAva}" target="_blank" th:text="#{link.avaChecker}">Joined Army List AVA Checker</a>
    </div>

    <div class="help">
        <a th:href="@{/help}" target="_blank" th:text="#{link.help}">Help</a>
    </div>

</div>

<footer>
    <div>
        <a href="mailto:contact@infinity.2nirwana.de" th:text="#{footer.contact}">Contact</a>
        <span class="footer-separator">|</span>
        <span th:if="${!imprint.isEmpty()}">
            <a th:href="@{/imprint}" th:text="#{footer.imprint}">Imprint</a>
            <span class="footer-separator">|</span>
        </span>
        <a href="https://github.com/twonirwana/Infinity-Data" target="_blank" th:text="#{footer.source}">Source Code</a>
    </div>
    <div style="margin-top: 1em; font-size: 0.9em;">
        <p style="margin: 0;" th:text="#{footer.thanks}">Special thanks to the following contributors for helping with the images:</p>
        <p style="margin: 0.25em 0 0 0;" th:if="${contributors != null and !contributors.isEmpty()}">
            <th:block th:each="contributor, iterStat : ${contributors}">
                <b th:text="${contributor}">ContributorName</b>
                <th:block th:switch="${iterStat.size - iterStat.count}">
                    <th:block th:case="0">!</th:block>
                    <th:block th:case="1" th:text="#{footer.and}"> and</th:block>
                    <th:block th:case="*">,</th:block>
                </th:block>
            </th:block>
        </p>
    </div>
</footer>

</body>
</html>
