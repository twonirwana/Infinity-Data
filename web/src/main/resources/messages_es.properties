faq.title=FAQ \u2013 Generador de Cartas de Infinity
faq.heading=Preguntas Frecuentes

faq.q1.question=\u00BFQu\u00E9 es el Trooper Card Generator?
faq.q1.answer.p1=El Trooper Card Generator es una herramienta creada por fans para el juego de mesa <a href="https://infinityuniverse.com/en" target="_blank">Infinity</a> de Corvus Belli.
faq.q1.answer.p2=Convierte un c\u00F3digo de ej\u00E9rcito del creador oficial <a href="https://infinityuniverse.com/army/infinity" target="_blank">Infinity Army</a> en cartas de tropas imprimibles con estad\u00EDsticas y perfiles de las unidades.

faq.q2.question=\u00BFPor qu\u00E9 no puedo imprimir varias cartas en una sola p\u00E1gina?
faq.q2.answer.p1=Esto suele ser un problema de la impresora. Intenta generar las cartas primero como un PDF en formato 9 a 1, y luego imprime el PDF desde el cuadro de di\u00E1logo de impresi\u00F3n de tu sistema con la opci\u00F3n de ajustar a la p\u00E1gina (scale fit page). Android tampoco tiene opci\u00F3n para imprimir varias p\u00E1ginas por hoja; puedes intentar crear primero un PDF y luego usar el Acrobat Reader oficial para imprimirlo.
faq.q2.answer.p2=Prueba con diferentes dise\u00F1os y navegadores; a veces Firefox funciona mejor que Chrome.

faq.q3.question=\u00BFC\u00F3mo obtengo el c\u00F3digo de mi ej\u00E9rcito?
faq.q3.answer.p1=Despu\u00E9s de crear tu lista en el creador <a href="https://infinityuniverse.com/army/infinity" target="_blank">Infinity Army</a>, haz clic en \u201CGenerate Army Code\u201D (Generar C\u00F3digo de Ej\u00E9rcito). Luego puedes copiar y pegar ese c\u00F3digo en el Generador de Cartas.

faq.q4.question=\u00BFCu\u00E1l es la diferencia entre los estilos de cartas?
faq.q4.answer.p1=Hay varios estilos de cartas disponibles:
faq.q4.answer.li1=<strong>Color e imagen - DIN-A4:</strong> Cartas a todo color con ilustraciones de las unidades del tama\u00F1o de una hoja A4. Se pueden reducir imprimiendo varias en una sola p\u00E1gina. \u00D3ptimo para cuatro o nueve cartas en una sola hoja A4.
faq.q4.answer.li2=<strong>Color e imagen - DIN-A4:</strong> Cartas a todo color con ilustraciones de las unidades dimensionadas para que se puedan imprimir seis en una sola hoja A4.
faq.q4.answer.li3=<strong>Lista general - DIN-A4:</strong> Una lista de ej\u00E9rcito compacta sin im\u00E1genes, dise\u00F1ada para imprimirse en hoja A4.
faq.q4.answer.li4=<strong>Color e imagen - DIN-A7:</strong> Cartas a todo color con ilustraciones de las unidades, dise\u00F1adas para imprimir nueve cartas por hoja A4.
faq.q4.answer.li5=<strong>Color e imagen - Carta EE. UU. (US Letter):</strong> Cartas a todo color con ilustraciones de las unidades del tama\u00F1o de una hoja US Letter. Se pueden reducir imprimiendo varias en una sola p\u00E1gina.
faq.q4.answer.li6=<strong>Blanco y negro - carta de juego:</strong> Cartas minimalistas que ahorran tinta con un tama\u00F1o de 59 \u00D7 91 mm (tama\u00F1o est\u00E1ndar de cartas de juego). No todas las opciones funcionan con este estilo.

faq.q5.question=\u00BFQu\u00E9 hace el \u201CFiltro de Unidades\u201D (Unit Filter)?
faq.q5.answer.p1=Usa la opci\u00F3n \u201CUnidades Distintas\u201D (Distinct Units) para generar solo una carta por cada perfil de tropa \u00FAnico. La opci\u00F3n \u201CSin Filtro\u201D (No Filter) crea una carta para cada tropa de tu lista, incluso si son id\u00E9nticas.

faq.q6.question=\u00BFPuedo usar mis propias im\u00E1genes para las unidades?
faq.q6.answer.p1=S\u00ED, es posible utilizando esta soluci\u00F3n alternativa:
faq.q6.answer.li1=<strong>Guarda la p\u00E1gina:</strong> Crea tus cartas como lo har\u00EDas normalmente. Una vez que est\u00E9s en la p\u00E1gina final de Resultados, guarda la p\u00E1gina entera en tu ordenador. Para hacer esto, haz clic derecho en cualquier parte de la p\u00E1gina y selecciona <em>Guardar como...</em> (o usa el atajo <kbd>Ctrl</kbd> + <kbd>S</kbd> / <kbd>Cmd</kbd> + <kbd>S</kbd>). Aseg\u00FArate de elegir "P\u00E1gina web, completa" como formato.
faq.q6.answer.li2=<strong>Abre la carpeta de im\u00E1genes:</strong> Tu navegador descargar\u00E1 ahora un archivo HTML y crear\u00E1 autom\u00E1ticamente una carpeta en la misma ubicaci\u00F3n (generalmente con el mismo nombre que el archivo). Esta carpeta contiene todas las im\u00E1genes utilizadas en la p\u00E1gina.
faq.q6.answer.li3=<strong>Reemplaza las im\u00E1genes:</strong> Abre esa carpeta y localiza las im\u00E1genes de las unidades que deseas cambiar. Simplemente reempl\u00E1zalas por tus propias im\u00E1genes personalizadas. <strong>Importante:</strong> Aseg\u00FArate de que tus nuevas im\u00E1genes tengan exactamente el mismo nombre de archivo y extensi\u00F3n que las originales. Incluso las cartas que actualmente no tienen imagen hacen referencia a un archivo de imagen con su ID de Perfil (consulta la exportaci\u00F3n csv o el c\u00F3digo HTML para verlo).
faq.q6.answer.li4=<strong>Finalizar:</strong> Por \u00FAltimo, abre el archivo HTML local descargado en tu navegador. Tus cartas se cargar\u00E1n ahora con tus im\u00E1genes personalizadas, y podr\u00E1s imprimirlas o guardarlas como PDF igual que antes.

faq.q7.question=\u00BFPor qu\u00E9 faltan algunas im\u00E1genes?
faq.q7.answer.p1=Actualmente Corvus Belli solo proporciona im\u00E1genes para ciertos perfiles de unidades. La comunidad est\u00E1 trabajando para a\u00F1adir im\u00E1genes para todas las tropas. Si te gustar\u00EDa ayudar, por favor <a href="mailto:contact@infinity.2nirwana.de">cont\u00E1ctame</a>.

faq.q8.question=\u00BFPor qu\u00E9 hay un * junto a algunos valores de PS o MOD de Alcance en la tabla de armas?
faq.q8.answer.p1=El asterisco (*) indica que los modificadores por habilidades, equipo o el perfil han alterado el valor predeterminado del arma.

faq.q9.question=\u00BFQu\u00E9 significa la C, E o S al final de una expresi\u00F3n de tirada de salvaci\u00F3n?
faq.q9.answer.p1=La C significa que el arma causa Da\u00F1o Continuo, la E que el arma causa da\u00F1o E/M y la S que el arma causa da\u00F1o Shock (Conmoci\u00F3n).

faq.q10.question=\u00BFPor qu\u00E9 recibo un mensaje de error con el c\u00F3digo de mi ej\u00E9rcito?
faq.q10.answer.p1=El c\u00F3digo de tu ej\u00E9rcito podr\u00EDa estar incompleto o desactualizado. Cuando Corvus Belli actualiza sus datos, los c\u00F3digos m\u00E1s antiguos pueden volverse inv\u00E1lidos.
faq.q10.answer.p2=Primero, comprueba si tu c\u00F3digo todav\u00EDa funciona en la herramienta <a href="https://infinityuniverse.com/army/infinity" target="_blank">Infinity Army</a>. Si funciona, el problema podr\u00EDa ser un error\u2014por favor <a href="mailto:contact@infinity.2nirwana.de">env\u00EDame un correo</a> o <a href="https://github.com/twonirwana/Infinity-Data/issues" target="_blank">abre un issue</a> en GitHub.

faq.q11.question=\u00BFPor qu\u00E9 el dise\u00F1o se ve roto para una tropa en espec\u00EDfico?
faq.q11.answer.p1=Algunos perfiles de unidades tienen datos inusuales o excesivos, y eso puede causar problemas de formato. Prueba las diferentes opciones con esa tropa para encontrar la mejor forma de imprimirla. A veces es necesario quitar la imagen para que aparezcan todas las armas.
faq.q11.answer.p2=Por favor <a href="mailto:contact@infinity.2nirwana.de">env\u00EDame un correo</a> o <a href="https://github.com/twonirwana/Infinity-Data/issues" target="_blank">abre un issue</a> en GitHub para que pueda mejorar el formato.

faq.q12.question=\u00BFC\u00F3mo puedo solicitar una nueva funci\u00F3n?
faq.q12.answer.p1=Puedes <a href="mailto:contact@infinity.2nirwana.de">enviarme un correo</a> directamente o <a href="https://github.com/twonirwana/Infinity-Data/issues" target="_blank">crear un issue</a> en GitHub para sugerir nuevas caracter\u00EDsticas o mejoras.

faq.q13.question=\u00A1Esto es genial! \u00BFC\u00F3mo puedo ayudar?
faq.q13.answer.p1=Las contribuciones siempre son bienvenidas, especialmente de aquellos con experiencia en dise\u00F1o HTML/CSS o dise\u00F1o gr\u00E1fico. Tambi\u00E9n se necesita ayuda para recopilar las im\u00E1genes de las tropas que faltan.
faq.q13.answer.p2=Para contribuir, <a href="mailto:contact@infinity.2nirwana.de">env\u00EDame un correo electr\u00F3nico</a> o <a href="https://github.com/twonirwana/Infinity-Data/pulls" target="_blank">env\u00EDa un pull request</a> en GitHub.