faq.title=FAQ \u2013 Infinity Card Generator
faq.heading=Frequently Asked Questions

faq.q1.question=What is the Trooper Card Generator?
faq.q1.answer.p1=The Trooper Card Generator is a fan-made tool for the <a href="https://infinityuniverse.com/en" target="_blank">Infinity</a> tabletop game by Corvus Belli.
faq.q1.answer.p2=It converts an army code from the official <a href="https://infinityuniverse.com/army/infinity" target="_blank">Infinity Army</a> builder into printable trooper cards with unit stats and profiles.

faq.q2.question=Why can\u2019t I print multiple cards on one page?
faq.q2.answer.p1=This is usually a printer issue. Try generating the cards as a 9-to-1 PDF first, then print the PDF from your system\u2019s print dialog with the option scale fit page. Android has also no option for multi page print, you can try create first a pdf and then use the official Acrobat Reader to print it.
faq.q2.answer.p2=Try multiple layouts and browser, sometimes Firefox is better than Chrome.

faq.q3.question=How do I get my army code?
faq.q3.answer.p1=After creating your list in the <a href="https://infinityuniverse.com/army/infinity" target="_blank">Infinity Army</a> builder, click \u201CGenerate Army Code\u201D. You can then copy and paste that code into the Card Generator.

faq.q4.question=What\u2019s the difference between the card styles?
faq.q4.answer.p1=Two card styles are available:
faq.q4.answer.li1=<strong>Color and image - DIN-A4:</strong> Full-color cards with unit artwork in the size of a A4 sheet. Can be shrunk by printing multiple on one page. Optimal for four or nine cards on a single A4 sheet.
faq.q4.answer.li2=<strong>Color and image - DIN-A4:</strong> Full-color cards with unit artwork in the dimension so six can be printed on a single A4 sheet.
faq.q4.answer.li3=<strong>Overview List - DIN-A4:</strong> A compact army list without image, designed to print on A4 sheet.
faq.q4.answer.li4=<strong>Color and image - DIN-A7:</strong> Full-color cards with unit artwork, designed to print nine cards per A4 sheet.
faq.q4.answer.li5=<strong>Color and image - US Letter:</strong> Full-color cards with unit artwork in the size of a US Letter sheet. Can be shrunk by printing multiple on one page.
faq.q4.answer.li6=<strong>Black and white - playing card:</strong> Minimalist, ink-friendly cards sized at 59 \u00D7 91 mm (standard playing card size). Not all options work with this style.

faq.q5.question=What does the \u201CUnit Filter\u201D do?
faq.q5.answer.p1=Use the \u201CDistinct Units\u201D option to generate only one card per unique trooper profile. The \u201CNo Filter\u201D option creates a card for every trooper in your list, even if they are identical.

faq.q6.question=Can I use my own images for the units?
faq.q6.answer.p1=Yes, this is possible using this workaround:
faq.q6.answer.li1=<strong>Save the page:</strong> Create your cards as you normally would. Once you are on the final Results page, save the entire page to your computer. To do this, right-click anywhere on the page and select <em>Save as...</em> (or use the shortcut <kbd>Ctrl</kbd> + <kbd>S</kbd> / <kbd>Cmd</kbd> + <kbd>S</kbd>). Make sure to choose "Webpage, Complete" as the format.
faq.q6.answer.li2=<strong>Open the image folder:</strong> Your browser will now download an HTML file and automatically create an accompanying folder in the same location (usually bearing the same name as the file). This folder contains all the images used on the page.
faq.q6.answer.li3=<strong>Replace the images:</strong> Open that folder and locate the unit images you want to change. Simply replace them with your own custom images. <strong>Important:</strong> Ensure that your new images have exactly the same file name and file extension as the original images you are. Even cards that have currently no image reference an image file with there Profile ID (see the csv export or the HTML code for it)
faq.q6.answer.li4=<strong>Finish up:</strong> Finally, open the downloaded local HTML file in your browser. Your cards will now load with your custom images, and you can print them out or save them as a PDF just like before.

faq.q7.question=Why are some images missing?
faq.q7.answer.p1=Currently Corvus Belli only provides images for certain unit profiles. The community is working to add images for all troopers. If you\u2019d like to help, please <a href="mailto:contact@infinity.2nirwana.de">contact me</a>.

faq.q8.question=Why is there a * next to some PS or Range MOD values in the weapon table?
faq.q8.answer.p1=The asterisk (*) indicates that modifiers from skills, equipment or profile have altered the weapon\u2019s default value.

faq.q9.question=What means the C, E or S at the end of a saving roll expression?
faq.q9.answer.p1=C means the weapons does Continous Damage, E that the weapon does E/M damage and S that the weapon does Shock damage

faq.q10.question=Why do I get an error message for my army code?
faq.q10.answer.p1=Your army code might be incomplete or outdated. When Corvus Belli updates their data, older codes can become invalid.
faq.q10.answer.p2=First, check if your code still works in the <a href="https://infinityuniverse.com/army/infinity" target="_blank">Infinity Army</a> tool. If it does, the issue might be a bug\u2014please <a href="mailto:contact@infinity.2nirwana.de">email me</a> or <a href="https://github.com/twonirwana/Infinity-Data/issues" target="_blank">open an issue</a> on GitHub.

faq.q11.question=Why is the layout broken for one specific trooper?
faq.q11.answer.p1=Some unit profiles have unusual or too much data and that can cause layout issues. Try the different options for this trooper to find the best printable option. Sometimes you need to remove the image to get all weapons.
faq.q11.answer.p2=Please <a href="mailto:contact@infinity.2nirwana.de">email me</a> or <a href="https://github.com/twonirwana/Infinity-Data/issues" target="_blank">open an issue</a> on GitHub so I can improve the formatting.

faq.q12.question=How can I request a new feature?
faq.q12.answer.p1=You can <a href="mailto:contact@infinity.2nirwana.de">email me</a> directly or <a href="https://github.com/twonirwana/Infinity-Data/issues" target="_blank">create an issue</a> on GitHub to suggest new features or improvements.

faq.q13.question=This is great! How can I help?
faq.q13.answer.p1=Contributions are always welcome \u2014 especially from those experienced in HTML/CSS design or graphic layout. Help is also needed to gather images for missing troopers.
faq.q13.answer.p2=To contribute, <a href="mailto:contact@infinity.2nirwana.de">send me an email</a> or <a href="https://github.com/twonirwana/Infinity-Data/pulls" target="_blank">submit a pull request</a> on GitHub.